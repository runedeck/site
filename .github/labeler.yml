area:pages:
    - changed-files:
          - any-glob-to-any-file: ["index.html", "guide/**", "first-contact/**"]

area:designs:
    - changed-files:
          - any-glob-to-any-file: "designs/**"

area:shared:
    - changed-files:
          - any-glob-to-any-file: "shared/**"

area:docs:
    - changed-files:
          - any-glob-to-any-file: ["README.md", "**/*.md"]

area:workflows:
    - changed-files:
          - any-glob-to-any-file: ".github/workflows/**"

area:deploy:
    - changed-files:
          - any-glob-to-any-file: ["wrangler.jsonc", ".assetsignore"]
